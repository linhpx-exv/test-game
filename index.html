```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cookie Viewer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      padding: 20px;
      line-height: 1.6;
    }

    .back-button {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f5f5f5;
      color: #222;
      text-decoration: none;
      cursor: pointer;
    }

    .back-button:active {
      background: #ddd;
    }

    h1 {
      font-size: 28px;
    }

    #cookies {
      font-size: 16px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <a
    class="back-button"
    href="native://movepage?name=webview_action&action=close"
  >
    ← Back
  </a>

  <h1>Cookies</h1>

  <pre id="cookies"></pre>

  <script>
    const cookieElement = document.getElementById("cookies");

    const cookies = document.cookie
      .split(";")
      .map(cookie => cookie.trim())
      .filter(cookie => cookie.length > 0);

    if (cookies.length === 0) {
      cookieElement.textContent = "No accessible cookies found.";
    } else {
      cookieElement.textContent = cookies.join("\n");
    }
  </script>

</body>
</html>
```
